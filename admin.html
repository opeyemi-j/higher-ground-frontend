<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissions Admin — Higher Ground</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-tint:#EFF7FB; --paper:#FFFFFF; --ink:#1C3B4A; --ink-soft:#4B6675;
    --sun:#FFC64B; --coral:#FF7A5C; --coral-dark:#E85E40; --leaf:#4FA687;
    --radius:14px; --shadow:0 12px 30px rgba(28,59,74,0.10);
    --font-display:'Baloo 2', sans-serif; --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-body); background:var(--sky-tint); color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:40px 24px 80px;}
  h1{font-family:var(--font-display);font-size:28px;margin:0 0 6px;}
  .subtitle{color:var(--ink-soft);margin:0 0 32px;font-weight:600;}

  /* Login screen */
  .login-card{
    max-width:380px;margin:80px auto;background:var(--paper);border-radius:var(--radius);
    padding:36px;box-shadow:var(--shadow);text-align:center;
  }
  .login-card h1{font-size:22px;}
  .login-card p{color:var(--ink-soft);font-size:14px;margin-bottom:20px;}
  input[type="password"]{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #D6E4EA;
    font-size:15px;font-family:var(--font-body);margin-bottom:14px;
  }
  input[type="password"]:focus{outline:none;border-color:var(--coral);}
  button{
    font-family:var(--font-display);font-weight:600;font-size:15px;
    background:var(--coral);color:#fff;border:none;border-radius:999px;
    padding:12px 24px;cursor:pointer;transition:background .15s ease;
  }
  button:hover{background:var(--coral-dark);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .login-error{color:#E24B4A;font-weight:700;font-size:13px;min-height:18px;margin-top:10px;}

  /* Dashboard */
  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
  .stat-pill{
    display:inline-block;background:var(--paper);border-radius:999px;padding:8px 18px;
    font-weight:700;font-size:14px;box-shadow:var(--shadow);
  }
  .stat-pill strong{color:var(--coral-dark);}
  .btn-secondary{background:var(--ink);}
  .btn-secondary:hover{background:#0f2530;}
  .actions{display:flex;gap:10px;}

  table{
    width:100%;border-collapse:collapse;background:var(--paper);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);
  }
  thead th{
    text-align:left;font-family:var(--font-display);font-size:13px;text-transform:uppercase;
    letter-spacing:.03em;color:var(--ink-soft);background:#F5FAFC;padding:14px 16px;
    border-bottom:1px solid #E4EEF2;
  }
  tbody td{padding:14px 16px;border-bottom:1px solid #EEF3F5;font-size:14px;vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFDFE;}
  .stage-badge{
    display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;
  }
  .stage-Nursery{background:#FFF6E2;color:#B8860B;}
  .stage-Kindergarten{background:#E8F5EE;color:var(--leaf);}
  .stage-Primary{background:#FDECE6;color:var(--coral-dark);}
  .msg-cell{max-width:220px;color:var(--ink-soft);}
  .empty-state, .loading-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-weight:600;
  }
  .pager{display:flex;justify-content:center;gap:10px;margin-top:20px;}
  .pager button{background:var(--paper);color:var(--ink);border:1.5px solid #D6E4EA;}
  .pager button:hover{background:#F5FAFC;}
  .pager span{align-self:center;font-weight:700;font-size:14px;color:var(--ink-soft);}
  .delete-btn{
    background:transparent;color:#E24B4A;border:1.5px solid #F3C6C6;
    padding:6px 14px;font-size:13px;border-radius:999px;
  }
  .delete-btn:hover{background:#FDECEC;}
  .delete-btn:disabled{opacity:.5;cursor:not-allowed;}

  .hidden{display:none;}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-card" id="loginCard">
  <h1>Admissions Admin</h1>
  <p>Enter the admin key to view form submissions.</p>
  <input type="password" id="apiKeyInput" placeholder="Admin API key" autocomplete="off">
  <button id="loginBtn">View Submissions</button>
  <p class="login-error" id="loginError"></p>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="wrap hidden" id="dashboard">
  <h1>Admissions Submissions</h1>
  <p class="subtitle">Higher Ground Nursery and Primary School</p>

  <div class="top-bar">
    <span class="stat-pill">Total: <strong id="totalCount">0</strong></span>
    <div class="actions">
      <button id="refreshBtn">Refresh</button>
      <button class="btn-secondary" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div id="loadingState" class="loading-state hidden">Loading submissions...</div>
  <div id="emptyState" class="empty-state hidden">No submissions yet.</div>
  <div id="errorState" class="empty-state hidden" style="color:#E24B4A;"></div>

  <table id="submissionsTable" class="hidden">
    <thead>
      <tr>
        <th>Date</th>
        <th>Parent</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Stage</th>
        <th>Message</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="pager hidden" id="pager">
    <button id="prevBtn">← Previous</button>
    <span id="pageLabel">Page 1</span>
    <button id="nextBtn">Next →</button>
  </div>
</div>

<script>
(function () {
  // Set this to your live backend URL (no trailing slash).
  var API_BASE = 'https://higher-ground-backend-production.up.railway.app';

  var PAGE_SIZE = 25;
  var offset = 0;
  var currentApiKey = '';

  var loginCard = document.getElementById('loginCard');
  var dashboard = document.getElementById('dashboard');
  var apiKeyInput = document.getElementById('apiKeyInput');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');
  var logoutBtn = document.getElementById('logoutBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var totalCount = document.getElementById('totalCount');
  var loadingState = document.getElementById('loadingState');
  var emptyState = document.getElementById('emptyState');
  var errorState = document.getElementById('errorState');
  var table = document.getElementById('submissionsTable');
  var tableBody = document.getElementById('tableBody');
  var pager = document.getElementById('pager');
  var pageLabel = document.getElementById('pageLabel');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
    });
  }

  function showOnly(el) {
    [loadingState, emptyState, errorState, table, pager].forEach(function (e) {
      e.classList.add('hidden');
    });
    if (el) el.classList.remove('hidden');
  }

  function loadSubmissions() {
    showOnly(loadingState);

    fetch(API_BASE + '/api/submissions?limit=' + PAGE_SIZE + '&offset=' + offset, {
      headers: { 'x-api-key': currentApiKey },
    })
      .then(function (res) {
        if (res.status === 401) throw new Error('UNAUTHORIZED');
        if (!res.ok) throw new Error('Request failed (status ' + res.status + ')');
        return res.json();
      })
      .then(function (data) {
        totalCount.textContent = data.total;

        if (!data.submissions.length) {
          showOnly(emptyState);
          pager.classList.add('hidden');
          return;
        }

        tableBody.innerHTML = data.submissions.map(function (s) {
          var stageClass = 'stage-' + (s.stage || '').replace(/[^A-Za-z]/g, '');
          return '<tr data-id="' + s.id + '">' +
            '<td>' + escapeHtml(formatDate(s.created_at)) + '</td>' +
            '<td>' + escapeHtml(s.parent_name) + '</td>' +
            '<td>' + escapeHtml(s.email) + '</td>' +
            '<td>' + escapeHtml(s.phone) + '</td>' +
            '<td><span class="stage-badge ' + stageClass + '">' + escapeHtml(s.stage) + '</span></td>' +
            '<td class="msg-cell">' + (s.message ? escapeHtml(s.message) : '<em>&mdash;</em>') + '</td>' +
            '<td><button class="delete-btn" data-delete-id="' + s.id + '">Delete</button></td>' +
            '</tr>';
        }).join('');

        showOnly(table);
        pager.classList.remove('hidden');
        pageLabel.textContent = 'Page ' + (Math.floor(offset / PAGE_SIZE) + 1);
        prevBtn.disabled = offset === 0;
        nextBtn.disabled = offset + PAGE_SIZE >= data.total;
      })
      .catch(function (err) {
        if (err.message === 'UNAUTHORIZED') {
          // Key was valid at login but stopped working (e.g. rotated) -- send back to login.
          logout();
          loginError.textContent = 'Session expired or key is invalid. Please log in again.';
          return;
        }
        errorState.textContent = 'Could not load submissions: ' + err.message;
        showOnly(errorState);
      });
  }

  function deleteSubmissionRow(id, btn) {
    if (!confirm('Delete this submission? This cannot be undone.')) return;

    btn.disabled = true;
    btn.textContent = 'Deleting...';

    fetch(API_BASE + '/api/submissions/' + id, {
      method: 'DELETE',
      headers: { 'x-api-key': currentApiKey },
    })
      .then(function (res) {
        if (res.status === 401) throw new Error('UNAUTHORIZED');
        if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || 'Delete failed'); });
        return res.json();
      })
      .then(function () {
        loadSubmissions();
      })
      .catch(function (err) {
        if (err.message === 'UNAUTHORIZED') {
          logout();
          loginError.textContent = 'Session expired or key is invalid. Please log in again.';
          return;
        }
        alert('Could not delete: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Delete';
      });
  }

  tableBody.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-delete-id]');
    if (!btn) return;
    deleteSubmissionRow(btn.getAttribute('data-delete-id'), btn);
  });

  function login() {
    var key = apiKeyInput.value.trim();
    if (!key) {
      loginError.textContent = 'Please enter the admin key.';
      return;
    }
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking...';

    fetch(API_BASE + '/api/submissions?limit=1', { headers: { 'x-api-key': key } })
      .then(function (res) {
        if (res.status === 401) throw new Error('Incorrect admin key.');
        if (!res.ok) throw new Error('Server error (status ' + res.status + ')');
        currentApiKey = key;
        sessionStorage.setItem('hg_admin_key', key);
        loginCard.classList.add('hidden');
        dashboard.classList.remove('hidden');
        offset = 0;
        loadSubmissions();
      })
      .catch(function (err) {
        loginError.textContent = err.message;
      })
      .finally(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = 'View Submissions';
      });
  }

  function logout() {
    currentApiKey = '';
    sessionStorage.removeItem('hg_admin_key');
    dashboard.classList.add('hidden');
    loginCard.classList.remove('hidden');
    apiKeyInput.value = '';
    offset = 0;
  }

  loginBtn.addEventListener('click', login);
  apiKeyInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') login();
  });
  logoutBtn.addEventListener('click', logout);
  refreshBtn.addEventListener('click', loadSubmissions);
  prevBtn.addEventListener('click', function () {
    offset = Math.max(0, offset - PAGE_SIZE);
    loadSubmissions();
  });
  nextBtn.addEventListener('click', function () {
    offset += PAGE_SIZE;
    loadSubmissions();
  });

  // Auto-login if a key was saved earlier this browser tab session.
  var savedKey = sessionStorage.getItem('hg_admin_key');
  if (savedKey) {
    apiKeyInput.value = savedKey;
    login();
  }
})();
</script>
</body>
</html>
